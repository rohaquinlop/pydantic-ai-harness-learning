name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'pr-reviewer: new round')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          NEW_ROUND: ${{ github.event.action == 'labeled' && '--new-round' || '' }}
          MODEL: ${{ vars.PR_REVIEWER_MODEL && format('--model={0}', vars.PR_REVIEWER_MODEL) || '' }}
        run: >-
          uv run pr-reviewer
          --base "origin/${{ github.base_ref }}"
          --pr "${{ github.event.pull_request.number }}"
          --post $NEW_ROUND $MODEL
