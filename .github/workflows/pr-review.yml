name: pr-review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["pr-reviewer: run", "pr-reviewer: new round"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Consume the approval label
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method DELETE
          "repos/${{ github.repository }}/issues/$PR/labels/$(jq -rn --arg l "$LABEL" '$l|@uri')"
      - name: Check out the reviewer from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false
      - name: Check out the PR as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: tool
      - name: Review
        working-directory: tool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          NEW_ROUND: "${{ github.event.label.name == 'pr-reviewer: new round' && '--new-round' || '' }}"
          MODEL: ${{ vars.PR_REVIEWER_MODEL && format('--model={0}', vars.PR_REVIEWER_MODEL) || '' }}
        run: >-
          uv run pr-reviewer
          --repo ../repo
          --base "origin/$BASE"
          --pr "$PR"
          --engine harness
          --post $NEW_ROUND $MODEL
